# Catalog Portfolio and Ownership Register (CR-013)
#
# The authoritative register of technehub-labs catalog repositories and the
# metamodel entity allocations they own. Referenced as "the catalog
# portfolio map" and "the catalog-ownership register" by metamodel CR-018,
# CR-020, and CR-022 dispositions, which name CR-013 (dea-governance) as
# the owning change.
#
# Observational fields (state, canonical_count) record the audit snapshot
# of 2026-10-30 (CR-MET-014 companion audit). They are informational for
# reconciliation; the metamodel's entity lifecycle field is the normative
# expression of realization maturity.
#
# Schema:
#   repo:            org repository name
#   entities:        metamodel entity ids allocated to this repo
#   state:           populated | skeleton | missing   (2026-10-30 audit)
#   canonical_count: canonical records at audit, -1 when repo missing
#   ratified:        date this register first recorded the repo
#   archived:        informational only (v12, CR-022): true when the GitHub
#                    repo is archived; the reconciler does not read this key

